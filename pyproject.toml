[project]
name = "boring-mcp"
version = "0.1.0"
description = "A boring MCP server for agent behavioral guidance via vector similarity search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
]

[project.scripts]
boring-mcp = "boring_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boring_mcp"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["boring_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=boring_mcp --cov-report=term-missing"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.coverage.run]
source = ["boring_mcp"]

[tool.coverage.report]
fail_under = 90

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
